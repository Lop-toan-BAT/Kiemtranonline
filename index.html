<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Kiểm Tra Trắc Nghiệm Trực Tuyến</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- KaTeX for LaTeX Math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i data-lucide="graduation-cap" class="w-7 h-7"></i>
        <div>
          <h1 class="text-lg font-bold leading-tight">THPT - BÀI KIỂM TRA TRẮC NGHIỆM</h1>
          <p class="text-xs text-indigo-200">Môn: Toán &amp; Vật lí</p>
        </div>
      </div>
      <div id="header-right" class="hidden items-center gap-3">
        <div class="flex items-center gap-1.5 bg-indigo-900/60 px-3 py-1.5 rounded-full text-sm font-semibold">
          <i data-lucide="clock" class="w-4 h-4 text-amber-300"></i>
          <span id="timer-display" class="font-mono text-amber-200">15:00</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-5xl mx-auto p-4 flex-1 w-full">

    <!-- Screen 1: Registration -->
    <section id="screen-start" class="max-w-lg mx-auto mt-8 bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200">
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-indigo-100 text-indigo-700 rounded-full flex items-center justify-center mx-auto mb-3">
          <i data-lucide="user-check" class="w-7 h-7"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-900">Thông Tin Thí Sinh</h2>
        <p class="text-sm text-slate-500 mt-1">Vui lòng điền thông tin để bắt đầu tính giờ làm bài</p>
      </div>

      <form id="form-start" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Họ và tên thí sinh</label>
          <input type="text" id="student-name" required placeholder="Ví dụ: Nguyễn Văn An" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Lớp</label>
            <input type="text" id="student-class" required placeholder="Ví dụ: 12A1" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-
